<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificaciones Ejemplo</title>
</head>
<body>
    
    <h1>Notificaciones Ejemplo</h1>
    <p>Estado: <span id ="estado" class="desconectado">desconectado</span></p>
    <p>Corre<code>node servidor.js</code>y en su terminal veras el estado del servidor</p>
    <ul id="lista"></ul>
    <script>
        const estado = document.getElementById('estado');
        const lista = document.getElementById('lista');

        //necesitamos un socket con protocolo TCP
        // un websocket es un socket con procotolo TCP pero con un protocolo de comunicacion adicional
        const socket = new WebSocket(`ws://${location.host}`);
        socket.addEventListener('open', () => {
            estado.textContent = 'conectado';
            estado.className = 'conectado';
        });
        socket.addEventListener('close', () => {
            estado.textContent = 'desconectado';
            estado.className = 'desconectado';
        });
        socket.addEventListener('mesage', (event) => {
            const {tipo, mensage, fecha} = JSON.parse(evento.data);
            const item = document.createElement('11');
            item.innerHTML = `<time>${new Date(fecha).toLocalDateString()}</time> Tipo de Estado [${tipo}] Mensaje: ${mensaje}`;
            lista.prepend(item);
        });
    </script>

</body>
</html>
